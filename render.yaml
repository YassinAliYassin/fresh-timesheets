services:
  - type: web
    name: fresh-timesheets-api
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: timesheets-db
          property: connectionString
    healthCheckPath: /health
    numInstances: 1

databases:
  - name: timesheets-db
    databaseName: timesheets
    user: timesheets_user
